# Type check, lint, both apps' configs (Win Zero and Win Zero Plus), and the unit tests in three
# time zones (UTC, Denver, Chatham), as each commit does locally. Native builds stay on EAS; the
# website deploys from Cloudflare Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:variants
      - run: npm run test:tz

  # The website (winzero.app). Cloudflare Pages builds it from website/ with only website's own
  # node_modules installed, so this job does the same: no root `npm ci`.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
