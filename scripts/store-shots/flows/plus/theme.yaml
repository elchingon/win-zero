# Settings › Themes › THEME, then back to Home.
appId: ${APP_ID}
---
- runFlow: ../common/settings.yaml
- scrollUntilVisible:
    element: "${THEME}.*"
    timeout: 120000
    centerElement: true
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "${THEME}.*"
    waitToSettleTimeoutMs: 500
- runFlow: ../common/top.yaml
- tapOn:
    text: "Done"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
