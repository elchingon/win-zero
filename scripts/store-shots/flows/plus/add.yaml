# Finish Add a goal and go back to Home.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: "Add goal"
    timeout: 30000
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Add goal"
    waitToSettleTimeoutMs: 500
- runFlow: ../common/settings.yaml
- runFlow: ../common/top.yaml
- tapOn:
    text: "Done"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
