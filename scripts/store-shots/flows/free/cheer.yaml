# Shot 3: turn on the Finish round button, replay the Day 50 round and finish it until the cheer
# shows CHEER.
appId: ${APP_ID}
---
- tapOn:
    text: "Leave the round"
    waitToSettleTimeoutMs: 500
- runFlow:
    file: ../common/toggle.yaml
    env:
      LABEL: "Finish round button"
      ON: 1
- runFlow: ../common/top.yaml
- tapOn:
    text: "Done"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "(?i)play now"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Not this time|Finish round"
    timeout: 20000
- runFlow:
    when:
      visible: "Not this time"
    commands:
      - tapOn:
          text: "Not this time"
          waitToSettleTimeoutMs: 500
- runFlow: ../common/cheer.yaml
